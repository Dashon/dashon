        r="26.596"
      >
      <stop
          id="stop5622"
          style="stop-color:#7DD3FC"
          offset="0"
      />
      <stop
          id="stop5626"
          style="stop-color:#38BDF8"
          offset=".5"
      />
      <stop
          id="stop5624"
          style="stop-color:#0284C7"
          offset="1"
      />
    </radialGradient>
    
    <!-- Highlight gradient - brand light blue to transparent (dimmed) -->
